<div class="main-container">

  <!-- Meal Type Selection Step -->
  <ng-container *ngIf="mealSelectionStep && scannedPatientId">
    <div class="meal-selection-container">
      <div class="selection-header">
        <h4>請選擇用餐時間</h4>
        <p>選擇您要記錄的用餐階段</p>
      </div>
      <div class="meal-type-buttons">
        <button
          class="meal-type-btn before-meal"
          (click)="selectMealType('Before')">
          <div class="btn-text">
            <span class="main-text">餐前</span>
          </div>
        </button>
        <button
          class="meal-type-btn after-meal"
          (click)="selectMealType('After')">
          <div class="btn-text">
            <span class="main-text">餐後</span>
          </div>
        </button>
      </div>
    </div>
  </ng-container>

  <!-- Meal Selection After Type Selection -->
  <ng-container *ngIf="!mealSelectionStep && hasMealsForToday()">
    <div class="header-section">
      <h2>新增食物攝取紀錄</h2>
      <button class="nav-button primary" (click)="capture()">
        Upload Food Intake
      </button>
    </div>

    <div class="meals-content">
      <h4 class="patient-title">
        病人 ID: {{ scannedPatientId }}
      </h4>
      <div *ngFor="let dayGroup of getMealsByDayCycle() | keyvalue: dayCycleSort">
        <div class="day-section">
          <h3 class="day-header">第 {{ dayGroup.key }} 天</h3>
          <div class="meals">
            <!-- Lunch -->
            <div class="meal-type-section">
              <div class="meals-grid">
                <div *ngFor="let assignment of getMealsByType(dayGroup.value, '午餐')" 
                     class="meal-card"
                     [class.selected]="selectedMealAssignmentId === assignment.id"
                     (click)="selectMealAssignment(assignment)">
                  <div class="meal-image">
                    <img [src]="assignment.meal_detail!.image || 'assets/images/meals/meal_placeholder.jpg'"
                         [alt]="assignment.meal_detail!.meal_name" />
                  </div>
                  <div class="meal-info">
                    <h4 class="meal-type-header">午餐</h4>
                    <p class="meal-name">{{ assignment.meal_detail!.meal_name || assignment.meal_name }}</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Dinner -->
            <div class="meal-type-section">
              <div class="meals-grid">
                <div *ngFor="let assignment of getMealsByType(dayGroup.value, '晚餐')" 
                     class="meal-card"
                     [class.selected]="selectedMealAssignmentId === assignment.id"
                     (click)="selectMealAssignment(assignment)">
                  <div class="meal-image">
                    <img [src]="assignment.meal_detail!.image || 'assets/images/meals/meal_placeholder.jpg'"
                         [alt]="assignment.meal_detail!.meal_name" />
                  </div>
                  <div class="meal-info">
                    <h4 class="meal-type-header">晚餐</h4>
                    <p class="meal-name">{{ assignment.meal_detail!.meal_name || assignment.meal_name }}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- No meals available for today -->
  <ng-container *ngIf="!hasMealsForToday()">
    <div class="no-assignments">
      <p>今日無可用餐點分配。</p>
    </div>
  </ng-container>

</div>
