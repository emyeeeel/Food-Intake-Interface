<div class="intakes-container">
  <app-header></app-header>

  <div *ngIf="deviceId" class="device-id-bar">
    裝置：{{ deviceId }}
  </div>

  <div class="main-container">
    <!-- Loading state -->
    <div *ngIf="loading" class="loading-spinner">
      <div class="spinner"></div>
    </div>
    <div *ngIf="checkingAssignment" class="loading-spinner assignment-checking">
      <div class="spinner"></div>
      <div class="checking-text">檢查住民配餐中...</div>
    </div>

    <!-- Rooms and outpatient -->
    <ng-container *ngIf="!loading && !selectedRoom">
      <div class="room-container">
          <div class="room-card" *ngFor="let room of getUniqueRooms()" (click)="selectRoom(room)">
            {{ room }}
          </div>
          <div class="outpatient">
            門診
          </div>
      </div>
    </ng-container>

    <!-- Beds -->
    <ng-container *ngIf="!loading && selectedRoom && !selectedBed">
      <div class="bed-header">
        <button class="back-btn" (click)="backToRooms()">← 返回房間</button>
      </div>
      <div class="bed-container">
        <div
          class="room-card bed-card"
          *ngFor="let patient of getBedsForRoom(selectedRoom)"
          (click)="selectBed(patient)"
          [class.disabled]="checkingAssignment"
        >
          {{ patient.bed_number }}
        </div>
      </div>
    </ng-container>

    <!-- Add Intake -->
    <ng-container *ngIf="selectedBed">
      <div class="bed-header">
        <button class="back-btn" (click)="backToBeds()">← 返回房間</button>
      </div>
      <div class="intake-container">
        <app-add-intake [scannedPatientId]="selectedBed.id" (intakeCompleted)="handleIntakeCompleted()"></app-add-intake>
      </div>
    </ng-container>

    <div *ngIf="assignmentDialogVisible" class="assignment-dialog-overlay" (click)="closeAssignmentDialog()">
      <div class="assignment-dialog" (click)="$event.stopPropagation()">
        <div class="assignment-dialog-title">{{ assignmentDialogTitle }}</div>
        <div class="assignment-dialog-message">{{ assignmentDialogMessage }}</div>
        <button class="assignment-dialog-button" (click)="closeAssignmentDialog()">確認</button>
      </div>
    </div>
  </div>
</div>
