<div class="table-container">
  <table class="recommendation-table">

    <!-- HEADER -->
    <thead>
      <tr>
        <th>Nutrient</th>
        <th>Weekly DRIs</th>
        <th *ngFor="let d of days">
          {{ getWeekDay(d?.date) }}<br>
          {{ d?.date | date:'MM/dd' }}
        </th>
        <th>Remarks</th>
      </tr>
    </thead>

    <!-- BODY -->
    <tbody>
      <tr *ngFor="let row of rows">

        <td>{{ row.nutrient }}</td>

        <td>
          {{ row.recommended.min | number:'1.0-1' }} – {{ row.recommended.max | number:'1.0-1' }} {{ row.unit }}
        </td>

        <td *ngFor="let v of row.values"
            [ngClass]="'cell-' + classify(v, row.recommended.min, row.recommended.max)">
          <div class="cell-content">
            <div class="status-badge" [ngClass]="'badge-' + classify(v, row.recommended.min, row.recommended.max)">
              <span class="material-icons status-icon">{{ getIcon(v, row.recommended.min, row.recommended.max) }}</span>
            </div>
            <!-- <span class="cell-value" *ngIf="v !== 0">{{ v | number:'1.0-1' }} {{ row.unit }}</span> -->
          </div>
        </td>

        <td class="remark">
          <div class="remark-chips">
            <div *ngFor="let part of row.remarkParts"
                 class="remark-chip" [ngClass]="'chip-' + part.cls">
              <span class="material-icons chip-icon">{{ part.icon }}</span>
              <span class="chip-label">{{ part.label }}</span>
            </div>
          </div>
        </td>

      </tr>
    </tbody>

  </table>
</div>
