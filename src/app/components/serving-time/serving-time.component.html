<div class="serving">
  <span class="time-text">時間</span>
  <div class="time-value" (click)="toggleDropdown()">
    <span class="selected-value">{{ selectedTime }}</span>
    <img
      src="assets/icons/down-icon.svg"
      alt="Down Icon"
      class="down-icon"
      [class.rotated]="isDropdownOpen">
    </div>

    <!-- Dropdown options -->
    <div class="dropdown-menu" [class.open]="isDropdownOpen">
      @for (option of timeOptions; track option) {
        <div
          class="dropdown-option"
          (click)="selectTime(option)"
          [class.selected]="option === selectedTime">
          {{ option }}
        </div>
      }
    </div>
  </div>
