<div class="main-container">
  @if (!selectedOption) {
    <div class="option-selection-container">
      <app-mode-banner (downloadTemplate)="selectOption('updateCycle')"></app-mode-banner>

      <h3>選擇操作方式</h3>
      <div class="options-grid">
        <button class="option-card" (click)="selectOption('addMeal')">
          <div class="option-icon">➕</div>
          <h4>新增單一餐點</h4>
          <p>手動輸入餐點資訊</p>
        </button>
        <button class="option-card" (click)="selectOption('updateCycle')">
          <div class="option-icon">📊</div>
          <h4>更新循環菜單使用Excel</h4>
          <p>批量上傳餐點資料</p>
        </button>
      </div>
    </div>
  }

  @if (selectedOption === 'addMeal') {
    <app-add-meal-form (back)="goBackToOptions()"></app-add-meal-form>
  }

  @if (selectedOption === 'updateCycle') {
    <app-add-meal-excel-import (back)="goBackToOptions()"></app-add-meal-excel-import>
  }
</div>
