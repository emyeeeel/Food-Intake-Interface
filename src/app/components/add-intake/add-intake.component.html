<div class="main-container">
  <h3>新增食物攝取紀錄</h3>

  <!-- Meal Type Selection Step -->
  @if (mealSelectionStep) {
    <div class="meal-selection-container">
      <div class="selection-header">
        <h4>請選擇用餐時間</h4>
        <p>選擇您要記錄的用餐階段</p>
      </div>
      <div class="meal-type-buttons">
        <button
          class="meal-type-btn before-meal"
          (click)="selectMealType('Before')">
          <div class="btn-text">
            <span class="main-text">餐前</span>
            <span class="sub-text">Before Meal</span>
          </div>
        </button>
        <button
          class="meal-type-btn after-meal"
          (click)="selectMealType('After')">
          <div class="btn-text">
            <span class="main-text">餐後</span>
            <span class="sub-text">After Meal</span>
          </div>
        </button>
      </div>
    </div>
  }

  <!-- Scanner Header (moved above scanner container) -->
  @if (!mealSelectionStep) {
    <div class="scanner-header">
      <button class="back-btn" (click)="goBackToSelection()">
        ← 返回選擇
      </button>
      <div class="selected-meal-info">
        <span class="meal-type-indicator">{{ getMealTypeDisplayText() }}</span>
        <span class="meal-type-subtitle">掃描 QR 碼記錄</span>
      </div>
    </div>
  }

  <!-- QR Scanner Section (shown after meal type selection) -->
  @if (!mealSelectionStep) {
    <div class="qr-scanner-container">
      <div class="scanner-section">
        <button class="start-scanner-btn" (click)="toggleScanner()">
          {{ showScanner ? '停止攝影機' : '開始掃描 QR 碼' }}
        </button>
        @if (showScanner) {
          <div class="camera-container">
            <div class="camera-viewport">
              <video #videoElement autoplay playsinline></video>
              <div class="scanner-overlay">
                <div class="scanner-frame"></div>
                <div class="scanner-instructions">
                  <p>將 QR 碼對準框內</p>
                </div>
              </div>
            </div>
            @if (scanResult) {
              <div class="scanner-result">
                <div class="result-success">
                  <h5>掃描成功!</h5>
                  <p>{{ scanResult }}</p>
                  <p class="meal-type-info">記錄類型: {{ getMealTypeDisplayText() }}</p>
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
