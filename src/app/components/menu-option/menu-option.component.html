<div class="menu-container">
  @for (option of visibleOptions; track option) {
    <div
      class="menu-option"
      [class.selected]="option.isSelected"
      (click)="selectOption(option)">
      <img
        [src]="option.isSelected ? option.selectedIcon : option.defaultIcon"
        [alt]="option.text + ' icon'"
        class="menu-icon">
        <span class="menu-text" [class.hidden]="collapsed">{{ option.text }}</span>
      </div>
    }
  </div>
