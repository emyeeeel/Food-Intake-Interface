<div class="main-container">
  <div class="current-week" (click)="togglePopup()">
    <span class="week-text" *ngIf="isHomePage">{{ currentWeekRange }}</span>
    <span class="day-text" *ngIf="!isHomePage">{{ currentDay }}</span>
    <img src="assets/icons/down-icon.svg" alt="Down Icon" class="down-icon">
  </div>

  <!-- Popup with HTML5 date picker -->
  <div class="popup-container" *ngIf="showPopup">
    <div class="custom-calendar">
      <div class="calendar-header">
        <h4>選擇日期</h4>
        <button class="close-btn" (click)="closePopup()">×</button>
      </div>
      <div class="date-picker-wrapper">
        <input 
          type="date" 
          id="popup-date-input"
          class="popup-date-input"
          [(ngModel)]="selectedDate"
          (change)="onDateSelected($event)">
      </div>
      <div class="calendar-actions">
        <button class="today-btn" (click)="selectToday()">今天</button>
        <button class="confirm-btn" (click)="confirmSelection()">確認</button>
      </div>
    </div>
  </div>
</div>
