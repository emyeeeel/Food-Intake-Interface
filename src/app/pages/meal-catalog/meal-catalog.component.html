<div class="meal-catalog-container">
  <app-menu-bar (mobileMenuToggle)="onMobileMenuToggle($event)"></app-menu-bar>
  <div class="main-container">
    <div class="row-1">
      <app-back></app-back>
      <div class="search-bar">
        <app-search-bar placeholder="搜尋餐點或日期..." (searchChanged)="searchQuery = $event"></app-search-bar>
      </div>
      <app-notif></app-notif>
    </div>

    @if (currentView === 'default') {
      <div class="row-3">
        <app-main-options
          iconSrc="assets/icons/add-icon.svg"
          optionText="新增膳食"
          altText="Add Meal Icon"
          backgroundColor="#00313C"
          textColor="#E6FEF9"
          (clicked)="navigateToAddMeal()">
        </app-main-options>
        <app-main-options
          iconSrc="assets/icons/all-icon.svg"
          optionText="查看所有膳食"
          altText="See All Meals Icon"
          backgroundColor="#40C1AC"
          textColor="#E6FEF9"
          (clicked)="navigateToAllMeals()">
        </app-main-options>
        <app-main-options
          iconSrc="assets/icons/print-icon.svg"
          optionText="列印膳食"
          altText="Print Meal Icon"
          backgroundColor="#E6FEF9"
          textColor="#00313C"
          (clicked)="navigateToPrintMeal()">
        </app-main-options>
      </div>

      <!-- Search results or today's meals -->
      @if (searchQuery) {
        <app-display-meal [searchQuery]="searchQuery"></app-display-meal>
      } @else {
        <div class="row-4">
          <div class="text-title">本日膳食</div>
          <app-date-container></app-date-container>
        </div>

        <div class="row-5">
          <app-todays-meal time="午餐"></app-todays-meal>
          <app-todays-meal time="晚餐"></app-todays-meal>
        </div>
      }
    }

    @if (currentView === 'add-meal') {
      <app-add-meal></app-add-meal>
    }

    @if (currentView === 'all-meals') {
      <app-display-meal></app-display-meal>
    }

    @if (currentView === 'print-meal') {
      <app-print-all-meals></app-print-all-meals>
    }

    @if (currentView === 'edit-meal') {
      <app-edit-meal [mealId]="mealId"></app-edit-meal>
    }

    @if (currentView === 'view-meal') {
      <app-show-meal [mealId]="mealId"></app-show-meal>
    }
  </div>
</div>
