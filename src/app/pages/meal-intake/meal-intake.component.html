<div class="meal-intake-container">
  <app-menu-bar (mobileMenuToggle)="onMobileMenuToggle($event)"></app-menu-bar>

  <!-- DEFAULT VIEW -->
  @if (currentView === 'default') {
    <div class="main-container" [class.mobile-menu-open]="isMobileMenuOpen">
      <div class="row-1">
        <app-back></app-back>
        <div class="search-bar">
          <app-search-bar></app-search-bar>
        </div>
        <app-notif></app-notif>
      </div>
      <!-- <div class="row-2">
        <app-filter-icon></app-filter-icon>
        @for (filterOption of filterOptions; track filterOption) {
          <app-filter-options [filterText]="filterOption"></app-filter-options>
        }
      </div> -->
      <div class="row-3">
        <app-main-options
          iconSrc="assets/icons/add-icon.svg"
          optionText="新增攝取紀錄"
          altText="Add Intake Icon"
          backgroundColor="#00313C"
          textColor="#E6FEF9"
          (click)="navigateToAddIntake()">
        </app-main-options>
        <app-main-options
          iconSrc="assets/icons/all-icon.svg"
          optionText="查詢所有紀錄"
          altText="See All Logs Icon"
          backgroundColor="#40C1AC"
          textColor="#E6FEF9"
          (click)="navigateToAllLogs()">
        </app-main-options>
        <app-main-options
          iconSrc="assets/icons/print-icon.svg"
          optionText="列印攝取紀錄"
          altText="Print Intake Logs Icon"
          backgroundColor="#E6FEF9"
          textColor="#00313C"
          (click)="navigateToPrintLogs()">
        </app-main-options>
      </div>
      <div class="row-4">
        <div class="text-title">
          近期攝取紀錄
        </div>
        <app-date-container></app-date-container>
      </div>
      <div class="row-5">
        @if (latestIntakes.length === 0 && !isLoading) {
          <div class="empty-state">
            <p>此日期尚無攝取紀錄</p>
          </div>
        }
         @for (record of latestIntakes; track record.intake.id) {

            <app-intake-log
              [time]="record.intake.meal_detail.meal_time"
              [assignedMeal]="
                record.intake.meal_detail.meal_time + '-' +
                record.intake.meal_detail.id + '-' +
                record.intake.meal_phase
              "
              [weight]="record.intake.weight_g"
              [patient]="formatPatientIdentifier(record.intake)"
              [volume]="getFormattedVolume(record)">
            </app-intake-log>

          }
      </div>
    </div>
  }

  <!-- ADD INTAKE VIEW -->
  @if (currentView === 'add') {
    <div class="main-container">
      <div class="row-1">
        <app-back (click)="currentView = 'default'"></app-back>
        <div class="search-bar">
          <app-search-bar></app-search-bar>
        </div>
        <app-notif></app-notif>
      </div>
      <!-- Add intake form content here -->
      <app-add-intake></app-add-intake>
    </div>
  }

  <!-- ALL LOGS VIEW -->
  @if (currentView === 'all') {
    <div class="main-container">
      <div class="row-1">
        <app-back (click)="currentView = 'default'"></app-back>
        <div class="search-bar">
          <app-search-bar></app-search-bar>
        </div>
        <app-notif></app-notif>
      </div>
      <!-- Display all intake logs here -->
      <app-display-intake></app-display-intake>
    </div>
  }

  <!-- PRINT LOGS VIEW -->
  @if (currentView === 'print') {
    <div class="main-container">
      <div class="row-1">
        <app-back (click)="currentView = 'default'"></app-back>
        <div class="search-bar">
          <app-search-bar></app-search-bar>
        </div>
        <app-notif></app-notif>
      </div>
      <!-- Print intake logs content here -->
      <app-print-all-intakes></app-print-all-intakes>
    </div>
  }
</div>
